packages:
  - "packages/*"
  - "apps/*"
minimumReleaseAgeStrict: true
allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  esbuild: true
  lightningcss: true
  prisma: true
minimumReleaseAgeExclude:
  - "@clerk/backend"
  - "@clerk/react"
  - "@clerk/shared"
  - "@clerk/tanstack-react-start"
  - "@types/node"
